<script>
/* 视图偏好：cc.viewL = 'frame' | 'bleed'；?frame=1/0 可强制。
   和 7.0 的 cc.view 分开存：同一个源下两版共用 localStorage，在竖版里点过「铺满」不该把横版也带着铺满。
   缺省时按「像不像一台手机」自动判断——横屏手机的宽度能到 932px，
   7.0 那条「宽度 ≤ 900 就铺满」在这里不成立，所以改看触屏 + 短边。 */
(function(){
  var v='';
  try{ v = localStorage.getItem('cc.viewL') || ''; }catch(_){}
  try{
    var q = new URLSearchParams(location.search).get('frame');
    if (q==='1') v='frame'; else if (q==='0') v='bleed';
  }catch(_){}
  var phone = false;
  try{ phone = matchMedia('(pointer:coarse)').matches && Math.min(innerWidth, innerHeight) <= 540; }catch(_){}
  var bleed = v==='bleed' || (v!=='frame' && phone);
  document.documentElement.classList.toggle('bleed', bleed);
  var lang=''; try{ lang = localStorage.getItem('cc.lang')||''; }catch(_){}
  try{ var ql = new URLSearchParams(location.search).get('lang'); if (ql) lang = ql; }catch(_){}
  if (lang === 'id') document.documentElement.classList.add('lang-id');
  /* 配色：cool（黑板冷调，默认） | pop（多巴胺）。?theme=pop 可直接进 */
  var th=''; try{ th = localStorage.getItem('cc.theme')||''; }catch(_){}
  try{ var qt = new URLSearchParams(location.search).get('theme'); if (qt) th = qt; }catch(_){}
  document.documentElement.dataset.theme = (th==='pop') ? 'pop' : 'cool';
  /* 多巴胺的三套配色：citrus（默认） | berry | matcha。?pal= 可直接指定 */
  var pa=''; try{ pa = localStorage.getItem('cc.pal')||''; }catch(_){}
  try{ var qp = new URLSearchParams(location.search).get('pal'); if (qp) pa = qp; }catch(_){}
  document.documentElement.dataset.pal = (pa==='berry'||pa==='matcha') ? pa : 'citrus';
})();
</script>

  /* 存储可能被禁用（无痕、沙箱预览、部分浏览器的 file://）。

  let ok = true; const mem = Object.create(null);
  try{
    localStorage.setItem('cc.__probe','1');
    if (localStorage.getItem('cc.__probe') !== '1') ok = false;
    localStorage.removeItem('cc.__probe');
  }catch(_){ ok = false; }
  return {
    get persists(){ return ok; },
    get(k,d){
      if (ok){ try{ const v = localStorage.getItem(k); if (v !== null) return v; }catch(_){ ok = false; } }
      return (k in mem) ? mem[k] : d;
    },
    set(k,v){
      mem[k] = String(v);
      if (ok){ try{ localStorage.setItem(k, String(v)); }catch(_){ ok = false; } }
    },
    del(k){ delete mem[k]; if (ok){ try{ localStorage.removeItem(k); }catch(_){ ok = false; } } }
  };

  /* 1) 整句精确匹配（第 15 课讲解/板书/练习/小测的完整译文） */
  if (ID_FULL.has(t)) return out.replace(t, ID_FULL.get(t));
  if (EN_FULL.has(t)) return out.replace(t, EN_FULL.get(t));
  if (t === '课') return out.replace('课','pelajaran');
  /* 2) 先整句词条（长词优先），再走带数字的正则兜底 */
  for (const [k,v] of ID_LIST) if (out.indexOf(k) >= 0) out = out.split(k).join(v);
  for (const [re,v] of ID_RE) out = out.replace(re, v);
  for (const [k,v] of EN_ID_LIST) if (out.indexOf(k) >= 0) out = out.split(k).join(v);
  return out;
}

/* 渲染后自动本地化：#screens 里任何重新生成的文字都会过一遍词典 */
function bindIdLocalizer(){
  const root = $('screens'); if (!root || !window.MutationObserver) return;
  const scan = () => {
    if (!ID()) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const jobs = []; let n;
    while ((n = w.nextNode())){
      if (!n.nodeValue) continue;
      const t = n.nodeValue.trim();
      if (!t) continue;
      const host = n.parentElement;
      if (host && host.closest && host.closest('[data-no-id]')) continue;
      if (ID_FULL.has(t) || EN_FULL.has(t) || /[\u4e00-\u9fff]/.test(n.nodeValue)) jobs.push(n);
    }
    jobs.forEach(n => { const v = toId(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; });
    root.querySelectorAll('[aria-label],[title],[alt]').forEach(el=>{
      ['aria-label','title','alt'].forEach(a=>{ const v = el.getAttribute(a); if (v) { const nv = toId(v); if (nv !== v) el.setAttribute(a, nv); } });
    });
  };
  new MutationObserver(() => { scan(); applyIdPinyin(root); }).observe(root, { childList:true, subtree:true });
  scan();
  applyIdPinyin(root);
}

   没有 cut 的老师（7.0 那九位）仍走「站位框」：立绘剪在右侧一列里、左缘羽化，
   各自不同的背景压成同一块板前。
   两种情况都吐 .dh-art（半身照）：小头像 .dh-mini 永远用它；有 cut 时课堂里由 CSS 藏起来。
   cut 加载失败就把 .dh-cut 整个摘掉，CSS 的 :has(.dh-cut) 不再成立，自动退回站位框。
   每张去背立绘比例不同（杨老师头更大、立绘更宽），站位和让位用的几个数按老师的 cutGeo
   写到根上；横屏再用 ar 算出一份 --cut-w，所有收边、让位都从实际宽度出发。 */
function cutVars(t){
  const g=t.cutGeo||{}, s=document.documentElement.style;
  if (g.ar) {
    s.setProperty('--cut-ar', g.ar);
    const [w,h] = g.ar.split('/').map(Number);
    if (w > 0 && h > 0) s.setProperty('--cut-ar-w', String(w/h));
    else s.removeProperty('--cut-ar-w');
  } else {
    s.removeProperty('--cut-ar');
    s.removeProperty('--cut-ar-w');
  }
  if (g.chalk!=null) s.setProperty('--cut-chalk', g.chalk); else s.removeProperty('--cut-chalk');
  if (g.hair!=null) s.setProperty('--cut-hair', g.hair); else s.removeProperty('--cut-hair');
  if (g.face) s.setProperty('--cut-chin', g.face[3]); else s.removeProperty('--cut-chin');
}
function dhArt(){
  const t = TE();
  if (t.cut) cutVars(t);
  const lit = "var d=this.closest('.dh');d.classList.add('has-art');var w=d.querySelector('.dh-wrap');if(w)w.style.display='none'";
  return `
    <div class="room-floor" aria-hidden="true"></div>

    ${t.cut ? `<div class="dh-cut" data-t="${t.id}" aria-hidden="true"><img src="${t.cut}" alt="" draggable="false" style="visibility:hidden"
         onload="this.style.visibility='';${lit}" onerror="this.parentNode.remove()" /></div>` : ''}
    <div class="dh-art"><img src="${t.img}" alt="" style="display:none"

function markTheaterRoundComplete(){

function theaterAct(){
  const tb = V.theater; if (!tb) return null;
  return THEATER_ACTS[Math.max(0, Math.min(tb.act, THEATER_ACTS.length - 1))];
}

function theaterBeat(){
  const tb = V.theater, act = theaterAct(); if (!tb || !act) return null;
  return act.beats[Math.max(0, Math.min(tb.beat, act.beats.length - 1))];
}

function theaterSpeaker(beat){
  return THEATER_CAST[(beat && beat.who) || 'narrator'] || THEATER_CAST.narrator;
}

function theaterLine(beat){
  return (beat && (beat.line || beat.target)) || { zh:'', en:'', id:'' };
}

function theaterSubtitleBlock(beat){
  const line = theaterLine(beat);
  if (!line.zh) return '';
  const nativeLine = ID() ? line.id : line.en;
  const chinese = `<p class="theater-say" data-no-id>${esc(line.zh)}</p>
    ${beat.py ? `<p class="theater-py">${esc(beat.py)}</p>` : ''}`;
  const nativeBlock = nativeLine ? `<p class="theater-native">${esc(nativeLine)}</p>` : '';
  return PREF.subtitle==='native' ? nativeBlock + chinese : chinese + nativeBlock;
}

function theaterKicker(beat){
  if (beat.type === 'title') return pick('转场','Transition','Transisi');
  if (beat.type === 'narration') return pick('旁白','Narration','Narasi');
  if (beat.type === 'model') return pick('老师示范','Teacher model','Contoh guru');
  if (beat.type === 'speak' || beat.type === 'repeat') return pick('轮到你','Your turn','Giliranmu');
  if (beat.type === 'choice') {
    if (beat.kind === 'listen') return pick('听辨选择','Listening choice','Pilihan menyimak');
    if (beat.kind === 'transfer') return pick('迁移选择','Transfer choice','Pilihan transfer');
    return pick('理解选择','Comprehension choice','Pilihan pemahaman');
  }
  return pick('对白','Dialogue','Dialog');
}

function theaterNextLabel(beat, act, index){
  if (beat.type === 'title') return pick('进入这一幕','Enter the scene','Masuk babak ini');
  if (index >= act.beats.length - 1){
    return V.theater.act >= THEATER_ACTS.length - 1
      ? pick('谢幕','Curtain call','Tutup tirai')
      : pick('走进下一幕','Next scene','Babak berikutnya');

  if (beat.type === 'choice') return pick('继续故事','Continue the story','Lanjutkan cerita');

    if (sayLine && !say(sayLine)) toast('这台设备没有中文语音。','No Chinese voice on this device.');
  };
  document.querySelectorAll('[data-theater-help]').forEach(b=>b.onclick = openTheaterHelp);
  document.querySelectorAll('[data-theater-choice]').forEach(b=>b.onclick = ()=> theaterPick(Number(b.dataset.theaterChoice)));
  document.querySelectorAll('[data-theater-action]').forEach(b=>b.onclick = ()=> theaterAction(b.dataset.theaterAction));
  const panel = document.querySelector('.theater-panel');
  if (panel && beat.type === 'choice' && tb.picked != null){
    const focus = panel.querySelector('.theater-feedback') || panel.querySelector('.theater-choice-list');
    if (focus) panel.scrollTop = Math.max(0, focus.offsetTop - 14);
  }
}

function theaterAdvance(){
  const tb = V.theater; if (!tb) return;
  const act = theaterAct();
  tb.hint = ''; tb.busy = false; tb.picked = null;
  if (tb.beat < act.beats.length - 1){ tb.beat += 1; }
  else if (tb.act < THEATER_ACTS.length - 1){ tb.act += 1; tb.beat = 0; }
  else { tb.done = true; markTheaterRoundComplete(); }
  render();
}

function theaterPick(index){
  const tb = V.theater, beat = theaterBeat(); if (!tb || !beat || !beat.options) return;
  if (tb.picked != null) return;
  const option = beat.options[index]; if (!option) return;
  tb.picked = index; tb.hint = '';
  if (/[\u4e00-\u9fff]/.test(option.zh || '')) say(option.zh, 0.8);
  render();
}

function theaterAction(action){
  const tb = V.theater; if (!tb || tb.busy) return;
  const beat = theaterBeat(); if (!beat) return;
  const line = theaterLine(beat);
  if (action === 'help'){ openTheaterHelp(); return; }
  if (action === 'replay'){
    if (line.zh) say(line.zh, 0.66);
    return;
  }
  if (action === 'model'){
    const target = beat.target || beat.line || line;
    tb.hint = beat.hint ? pick(beat.hint.zh,beat.hint.en,beat.hint.id) : '';
    if (target.zh) say(target.zh, 0.72);
    render(); return;
  }
  if (action === 'retry-choice'){
    tb.picked = null; tb.hint = '';
    if (line.zh) say(line.zh, 0.66);
    render(); return;
  }
  if (action === 'next'){
    if (beat.type === 'choice'){
      const option = theaterSelectedOption(beat);
      if (!option || !option.ok) return;
    }
    theaterAdvance(); return;
  }
  if (action === 'finish'){
    tb.done = true; tb.hint = ''; markTheaterRoundComplete(); render(); return;
  }
  if (action === 'speak' || action === 'repeat'){
    const atAct = tb.act, atBeat = tb.beat;
    tb.busy = true; render();
    setTimeout(()=>{
      if (!V.theater || V.theater.act !== atAct || V.theater.beat !== atBeat) return;
      V.theater.busy = false;
      theaterAdvance();
    }, 950);
  }
}

function openTheaterHelp(){
  const beat = theaterBeat(); if (!beat) return;
  const line = theaterLine(beat);
  const target = beat.target || beat.line || line;
  openSheet(`<h3>${pick('需要一点帮助？','Need a little help?','Butuh sedikit bantuan?')}</h3>
    <p>${pick('老师可以把这一句放慢、给关键词，或者完整示范一次。','I can slow it down, give you a keyword, or model the whole sentence.','Aku bisa memperlambat, memberi kata kunci, atau memberi contoh lengkap.')}</p>
    <div class="tfrow">
      <button class="tfbtn" data-theater-help-choice="slow"><b>${pick('慢一点','Slower','Lebih lambat')}</b><small>${pick('听清每个字','Hear every word','Dengar tiap kata')}</small></button>
      <button class="tfbtn" data-theater-help-choice="keyword"><b>${pick('关键词','Keyword','Kata kunci')}</b><small>${pick('先抓住重点','Catch the key idea','Tangkap ide utama')}</small></button>
    </div>
    <button class="btn light" data-theater-help-choice="model">${ic('spark')} ${pick('给我完整示范','Model the whole sentence','Contohkan seluruh kalimat')}</button>`);
  document.querySelectorAll('[data-theater-help-choice]').forEach(b=>b.onclick=()=>{
    if (!V.theater) return;

    if (how === 'slow' && line.zh) say(line.zh, 0.56);
    if (how === 'model' && target.zh) say(target.zh, 0.7);
    V.theater.hint = how === 'slow'
      ? pick('老师放慢了语速：先听停顿，再听每个字。','Slower now: listen for the pauses first, then each word.','Lebih lambat: dengarkan jeda dulu, lalu setiap kata.')
      : pick((beat.hint || beat.actionCopy).zh,(beat.hint || beat.actionCopy).en,(beat.hint || beat.actionCopy).id);
    closeSheet(); render();
  });
}

function finishInAppTheater(){
  if (!V.theater) return;
  if (PREF.pending && !PREF.done) PREF.returned = true;
  if (S.taught){
    S.lesson = Math.min(lv(S.startLv).lessons, S.lesson + 1);
    S.taught = false;
    S.scenarioDone = false;
    S.scenarioStarted = false;
    S.scenarioBeat = 0;
    LS.del('cc.lsn');
  }
  V.theater = null; V.tab = 'today'; render();
}

  $('screens').innerHTML = `

      ${slate}

      <div class="cap"><p>${say}</p></div>

  </div>`;

  /* 绑定 */
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const val=b.dataset.opt;
    if (st===1){ D.purpose=val; V.intakeStep=2; }
    else if (st===2){ D.timeline=val; V.intakeStep=3; }
    else if (st===3){ D.audio=parseInt(val,10); renderIntake(); return; }
    else if (st===5){ D.spoken=parseInt(val,10); V.intakeStep=6; }
    else if (st===6){ D.min=parseInt(val,10); V.intakeStep=7; }
    render();
  });
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.g, k=D.glyphs.indexOf(i);
    if (k<0) D.glyphs.push(i); else D.glyphs.splice(k,1);
    renderIntake();
  });
  if ($('play')) $('play').onclick = ()=>{
    $('playT').textContent = CUI()?'已播放一次':'Played once';
    if (!say(PROBE_AUDIO.play)) toast('这台设备没有中文语音。','No Chinese voice on this device.');
  };
  if ($('go')) $('go').onclick = ()=>{
    if (st===7){ commit(); return; }

  if ($('lower')) $('lower').onclick = ()=>{

    else toast('不能再低了，这已经是你的起点。','Can’t go lower — that’s already your start.');

}
function optRow(id, t, d, x, sel, i){
  return `<button class="opt ${sel?'sel':''}" data-opt="${esc(id)}">
    <span class="opt-k num">${i+1}</span>
    <span class="opt-b"><span class="opt-t">${t}</span>${d?`<span class="opt-d">${d}</span>`:''}</span>
    ${x?`<span class="opt-x">${x}</span>`:''}</button>`;
}
function canGo(st){
  if (st===1) return !!D.purpose;
  if (st===2) return !!D.timeline;
  if (st===3) return D.audio!==null;
  if (st===4) return true;
  if (st===5) return D.spoken!==null;
  return true;
}

function verdict(){
  const p = PURPOSE.find(x=>x.id===D.purpose) || PURPOSE[0];
  const gl = D.glyphs.map(i=>PROBE_GLYPHS[i]);
  const topLv = gl.length ? Math.max(...gl.map(g=>g.lv)) : 0;
  const sp = SPOKEN[D.spoken] || SPOKEN[0];
  const heard = D.audio === PROBE_AUDIO.opts.findIndex(o=>o.ok);

  let start = 1;
  if (gl.length>=6 && topLv>=2 && sp.score>=2 && heard) start = 3;
  else if (gl.length>=4 && sp.score>=1) start = 2;
  let target = Math.max(start, p.target - (D.lower||0));

  const totalLessons = lessonsBetween(start, target);
  const rate = (MINUTES.find(m=>m.id===D.min)||MINUTES[1]).rate;
  const weeks = Math.max(1, Math.round(totalLessons/(rate*7)));

  const why1 = ID()
    ? `Kamu belajar Mandarin untuk <em>${p.idn||toId(p.zh)}</em> — ${toId(p.d.zh)}. Untuk keperluan ini biasanya perlu sampai <em>HSK ${p.target}</em>.`
    : CUI()
    ? `你学中文是为了<em>${p.zh}</em>——${p.d.zh}。这类用途通常要到 <em>HSK ${p.target}</em> 才够用。`
    : `Your purpose is <em>${p.en.toLowerCase()}</em> — ${p.d.en.toLowerCase()}. That normally needs <em>HSK ${p.target}</em>.`;
  const why2 = ID()
    ? `Hasil tes: soal menyimak ${heard?'benar':'belum benar'}, mengenali <em>${gl.length} / 8</em> kata${topLv>=2?` (termasuk kata HSK ${topLv})`:''}, kemampuan bicara “${toId(sp.zh).toLowerCase()}”. Titik awal: <em>HSK ${start}</em>.`
    : CUI()
    ? `摸底：听辨题${heard?'答对了':'没答对'}，认得 <em>${gl.length} / 8</em> 个词${topLv>=2?`（含 HSK ${topLv} 的词）`:''}，口语是「${sp.zh}」。起点放在 <em>HSK ${start}</em>。`
    : `Placement: you ${heard?'got':'missed'} the listening item, recognised <em>${gl.length} of 8</em> words${topLv>=2?` (incl. HSK ${topLv})`:''}, speaking is “${sp.en.toLowerCase()}”. Start: <em>HSK ${start}</em>.`;
  const why3 = ID()
    ? `Dengan ${D.min} menit per hari dan satu pelajaran sehari, sampai HSK ${target} perlu <em>${totalLessons} pelajaran</em>, sekitar <em>${weeks} minggu</em>.`
    : CUI()
    ? `按每天 ${D.min} 分钟、一天一课，到 HSK ${target} 共 <em>${totalLessons} 课</em>，大约 <em>${weeks} 周</em>。`
    : `At ${D.min} min a day, one lesson a day, HSK ${target} is <em>${totalLessons} lessons</em> away — about <em>${weeks} weeks</em>.`;

  const d = daysToExam();
  const byExam = Math.floor(d*rate);
  let reach=start, left=byExam;
  while (reach<=6 && left>lv(reach).lessons){ left-=lv(reach).lessons; reach++; }
  reach = Math.min(6,reach);
  const pct = Math.round(left/lv(reach).lessons*100);
  let examNote;
  if (ID()){
    if (D.timeline==='exam1213'){
      examNote = `Kamu ikut ujian <b>${EXAM.date}</b> — <b>${d} hari</b> lagi. Dengan ${D.min} menit per hari, saat ujian kamu baru sampai sekitar <b>${pct}% dari HSK ${reach}</b>. ${ pct<80 ? `Artinya HSK ${reach} belum selesai. Dua pilihan: ambil <b>HSK ${Math.max(1,reach-1)}</b> agar aman, atau tambah jadi 45 menit per hari untuk mengejar HSK ${reach}.` : `Sudah cukup untuk <b>HSK ${reach}</b>, tapi sisakan dua minggu terakhir untuk soal latihan.` }`;
    } else if (D.timeline==='none'){
      examNote = 'Kamu tidak berencana ujian, jadi tidak ada tenggat. Level tetap mengikuti silabus — itu alat ukur kemajuan, bukan hanya format ujian.';
    } else {
      examNote = `Dengan pace ini, dalam <b>${weeks} minggu</b> kamu sampai HSK ${target}. Kalau mau ikut ujian, kabari dua bulan sebelumnya supaya bagian akhir diganti latihan soal.`;
    }
  } else if (D.timeline==='exam1213'){
    examNote = CUI()
      ? `你要考 <b>${EXAM.date}</b> 那场，还有 <b>${d} 天</b>。按每天 ${D.min} 分钟，到考试那天你大约走到 <b>HSK ${reach} 的 ${pct}%</b>。${
          pct<80 ? `也就是说 HSK ${reach} 还没学完。两条路：这次稳妥报 <b>HSK ${Math.max(1,reach-1)}</b>，或者把每天时间加到 45 分钟去赶 HSK ${reach}。`
                 : `够报 <b>HSK ${reach}</b>，但最后两周要留出来做真题。`}`
      : `You want the <b>${EXAM.date}</b> sitting — <b>${d} days</b> away. At ${D.min} min a day you’ll be about <b>${pct}% through HSK ${reach}</b> by then. ${
          pct<80 ? `HSK ${reach} won’t be finished. Either sit <b>HSK ${Math.max(1,reach-1)}</b> safely, or go to 45 min a day and push for HSK ${reach}.`
                 : `Enough for <b>HSK ${reach}</b>, but keep the last two weeks for past papers.`}`;
  } else if (D.timeline==='none'){
    examNote = CUI()
      ? '你不打算考试，课表就没有截止日期。等级照样按大纲走——它是衡量进度的尺子，不只是考试格式。'
      : 'No exam, so no deadline. We still follow the levels: they’re the ruler for progress, not just an exam format.';
  } else {
    examNote = CUI()
      ? `按这个进度，<b>${weeks} 周</b>后到 HSK ${target}。真要报考，提前两个月告诉我，我把最后一段换成真题训练。`
      : `At this pace you reach HSK ${target} in <b>${weeks} weeks</b>. Decide to sit it, tell me two months ahead and I’ll switch to past papers.`;
  }
  return { start, target, totalLessons, weeks, why1, why2, why3, examNote };
}
function commit(){
  const v = verdict();
  S.purpose=D.purpose; S.timeline=D.timeline; S.min=D.min;
  S.startLv=v.start; S.target=v.target;
  S.probe=[ (D.audio===PROBE_AUDIO.opts.findIndex(o=>o.ok))?1:0, D.glyphs.length, D.spoken||0 ].join(',');
  S.lesson=15; S.taught=false; S.done=true; S.score=''; S.scenarioDone=false; S.scenarioStarted=false; S.scenarioBeat=0;

function probeSummary(){
  const [a,g,s]=S.probe.split(',').map(Number);
  if (ID()){
    return (a?'soal menyimak benar':'soal menyimak belum benar')
      + ', mengenali ' + g + ' dari 8 kata umum'
      + ', bicara: “' + toId((SPOKEN[s]||SPOKEN[0]).zh).toLowerCase() + '”';
  }

  return (a?(CUI()?'听辨题答对':'passed the listening item'):(CUI()?'听辨题没答对':'missed the listening item'))
    + sep + (CUI()?`认得 ${g} / 8 个常用词`:`recognised ${g} of 8 words`)
    + sep + (CUI()?'口语「'+(SPOKEN[s]||SPOKEN[0]).zh+'」':'speaking: '+(SPOKEN[s]||SPOKEN[0]).en.toLowerCase());
}

/* —— 星星墙与星章：把「进度」翻译成看得见的星 —— */
let starSeen = false;
function starCard(){
  const L = lv(S.startLv), total = L.lessons;
  const lit  = Math.min(total, S.taught ? S.lesson : S.lesson-1);
  const nowN = S.taught ? 0 : S.lesson;
  const days = new Set(starDays()), wk = weekKeys(), today = dayKey();
  const DOW = ID() ? ['Sen','Sel','Rab','Kam','Jum','Sab','Min']
                   : (CUI() ? ['一','二','三','四','五','六','日'] : ['M','T','W','T','F','S','S']);
  const list = total <= 60
    ? Array.from({length: total}, (_,i)=>i+1)
    : (u => Array.from({length: u.to-u.from+1}, (_,i)=>u.from+i))(unitOf(S.lesson));
  const cols = list.length > 24 ? 10 : 8;
  const cells = list.map((n,i)=>{
    const st = n <= lit ? 'done' : (n === nowN ? 'now' : 'todo');
    const mark = st === 'now' || (nowN === 0 && n === lit);
    return `<button class="st ${st}"${mark?' id="stNow"':''} data-star="${n}" data-st="${st}"
      style="animation-delay:${Math.min(i*22,560)}ms"
      aria-label="${pick('第 '+n+' 课','Lesson '+n,'Pelajaran '+n)}">${starSvg()}</button>`;
  }).join('');
  const week = wk.map((k,i)=>`<span class="wk${days.has(k)?' on':''}${k===today?' today':''}"><b>${DOW[i]}</b><em>${starSvg()}</em></span>`).join('');
  return `<div class="starwall">
    <div class="sw-head"><h3>${pick('点亮这一路','Stars so far','Bintang sejauh ini')}</h3><b class="num">${lit}<small>/ ${total}</small></b></div>
    <div class="stars" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div>
    <div class="week">${week}</div>
  </div>`;
}
function badgeShelf(){
  const lit = Math.min(lv(S.startLv).lessons, S.taught ? S.lesson : S.lesson-1);
  const B = [
    { at:1,  zh:'起步',   en:'First step',  id:'Langkah awal', sub:{zh:'上完第 1 课',   en:'Lesson 1',           id:'Pelajaran 1'} },
    { at:7,  zh:'问候',   en:'Greetings',   id:'Sapaan',       sub:{zh:'第一单元全亮', en:'Unit 1 complete',    id:'Unit 1 lengkap'} },
    { at:10, zh:'十课',   en:'Ten lessons', id:'Sepuluh',      sub:{zh:'第 10 课',     en:'Lesson 10',          id:'Pelajaran 10'} },
    { at:14, zh:'一家人', en:'Family',      id:'Keluarga',     sub:{zh:'第二单元全亮', en:'Unit 2 complete',    id:'Unit 2 lengkap'} },
    { at:15, zh:'声调',   en:'Tone lab',    id:'Lab nada',     sub:{zh:'第 15 课当堂', en:'Lesson 15 in class', id:'Pelajaran 15'}, tone:true },
    { at:21, zh:'说时间', en:'Telling time',id:'Bilang waktu', sub:{zh:'第三单元全亮', en:'Unit 3 complete',    id:'Unit 3 lengkap'} }
  ];
  const got = it => it.tone ? (S.lesson > 15 || (S.lesson === 15 && S.taught)) : lit >= it.at;
  const n = B.filter(got).length;
  return `<div class="sec-head"><h3>${pick('星章','Star badges','Lencana bintang')}</h3>
      <span>${pick(`已点亮 ${n} / 6`, `${n} / 6 lit`, `${n} / 6 menyala`)}</span></div>
    <div class="badges">${B.map(it=>{
      const on = got(it), name = pick(it.zh, it.en, it.id);
      return `<button class="badge ${on?'earned':'lock'}" data-badge="${it.at}" data-on="${on?'1':''}" data-name="${name}">
        <span class="bd">${starSvg()}</span><b>${name}</b>
        <small>${pick(it.sub.zh, it.sub.en, it.sub.id)}</small></button>`;
    }).join('')}</div>`;
}

function chatSay(text){

  clearTimeout(chatTimer);
  chatTimer = setTimeout(()=>{

    CHAT.push({ r:'t', t: teacherChatReply(t) }); saveChat(); paintChat();

function chatListen(){

const LSTEPS = LC.STEP_NAMES;
let talkTimer = null;

/* 三语共用：在「生词」后插入字形卡，在 t4（发音·三声连读）后插入声调实验室。
   注意：不要直接改 lesson-core.js 里的 LC.SEGS —— 桌面版（index.html）也用它。 */
const EXT_SEGS = (() => {
  const out = [];
  for (const sg of LC.SEGS){
    out.push(sg);
    if (sg.kind === 'words') out.push({ step:1, kind:'shapes' });
    if (sg.kind === 'talk' && sg.talk === 't4') out.push({ step:4, kind:'tonefeet' });
  }
  return out;
})();
const SEGS = () => EXT_SEGS;
const segNow = () => SEGS()[V.lesson.seg];
function segGo(n){
  clearTimeout(talkTimer); talkTimer=null;
  const L=V.lesson; L.seg=n; L.sub=0; L.tk=null;
  render(); const sc=document.querySelector('.screen'); if (sc) sc.scrollTop=0;
}
function segNext(){ if (V.lesson.seg < SEGS().length-1) segGo(V.lesson.seg+1); }
function quitLesson(){ clearTimeout(talkTimer); talkTimer=null; V.lesson=null; LS.del('cc.lsn'); render(); }
/* 课时进度落盘：刷新 / 误触返回之后能从中断的那一段接着上 */
function saveLesson(){
  if (!V.lesson) return LS.del('cc.lsn');
  try{ LS.set('cc.lsn', JSON.stringify({ seg:V.lesson.seg, sub:V.lesson.sub, ans:V.lesson.ans })); }catch(_){}
}
function restoreLesson(){
  const raw = LS.get('cc.lsn','');
  if (!raw) return null;
  try{
    const o = JSON.parse(raw);
    if (!o || typeof o.seg !== 'number' || o.seg < 0 || o.seg >= SEGS().length) return null;
    V.lesson = { seg:o.seg, sub:o.sub||0, ans:o.ans||{}, t0:Date.now(), tk:null };
    return o.seg;
  }catch(_){ LS.del('cc.lsn'); return null; }
}

/* ---------- 讲解播放器 ---------- */
function openTalk(id, nested){
  const t = LC.TALKS[id];
  V.lesson.tk = { id, beats:t.beats.slice(), i:0, paused:false, slow:false,
                  picked:null, done:false, used:false, armed:-1, nested:!!nested };
  render();
}
function talkNext(){
  const tk = V.lesson.tk; if (!tk) return;
  clearTimeout(talkTimer); talkTimer=null;
  if (tk.i < tk.beats.length-1){ tk.i++; }
  else { tk.done = true; }
  render();
}
function boardSpeakText(b){
  if (!b) return '';
  if (b.t==='line') return b.z;
  if (b.t==='rows'){ const g=b.rows.find(r=>r.mark==='✓'); return g?g.z:''; }
  if (b.t==='slot'){ const z=b.cells.map(c=>c.z).join(''); return z.length>1?z:''; }
  if (b.t==='list') return b.items[0] && b.items[0].z || '';
  if (b.t==='tone') return b.sylls.map(x=>x.z).join('');
  return '';
}
function renderTalk(){
  const L=V.lesson, tk=L.tk;
  if (!tk){ return openTalk(segNow().talk || 't0'); }
  const T=LC.TALKS[tk.id];
  const beat = tk.beats[tk.i];
  /* 板书保留到下一次更换 */
  let board = null;
  for (let k=tk.i;k>=0;k--){ if (tk.beats[k].board){ board = tk.beats[k].board; break; } }
  const sp = boardSpeakText(board);
  let gloss = '';
  if (ID()){
    tk.gl = tk.gl || [];
    for (const [k,v] of ID_GLOSS) if (beat.zh.indexOf(k) >= 0 && tk.gl.indexOf(k) < 0){ tk.gl.push(k); gloss = v; break; }
  }

  const chk = tk.done && T.check ? (()=> {
    const picked = tk.picked;
    return `<div class="chk">
      <div class="chk-k">${CUI()?'听懂了吗':'QUICK CHECK'}</div>
      <p class="chk-q">${tx(T.check.q)}</p>
      ${T.check.opts.map((o,k)=>{
        let cls=''; if (picked!==null) cls = o.ok?'ok':(picked===k?'no':'dim');
        return `<button class="qopt ${cls}" data-chk="${k}"><span class="k num">${k+1}</span><span>${tx(o.t)}</span></button>`;
      }).join('')}
      ${picked!==null?`<div class="fb ${T.check.opts[picked].ok?'ok':'no'}">${T.check.opts[picked].ok?tx(T.check.ok):tx(T.check.no)}</div>
        <div style="height:10px"></div>
        <button class="btn" id="tkGo">${CUI()?'继续':'Continue'} ${ic('right')}</button>`:''}
    </div>`;
  })() : '';

  const endNoCheck = tk.done && !T.check
    ? `<div class="talk-ctl" style="padding-top:0"><button class="btn" id="tkGo" style="flex:1">${CUI()?'继续':'Continue'} ${ic('right')}</button></div>` : '';

  const nativeFirst = ZH() && !!beat.en && PREF.subtitle==='native';
  const talkPrimary = nativeFirst ? beat.en : (CUI() ? beat.zh : beat.en);
  const talkSecondary = ZH() && beat.en ? (nativeFirst ? beat.zh : beat.en) : '';

  $('screens').innerHTML = `
  <div class="screen flush">
    <div class="dh speaking talk${chk?' has-chk':''}">
      ${dhArt()}
      <div class="talk-top">
        <button class="talk-x" id="lQuit" aria-label="${CUI()?'退出':'Exit'}">${ic('x')}</button>
        <span class="talk-tag">${ic('spark')} ${tx(T.tag)}</span>
      </div>
      <div class="talk-bar" aria-hidden="true">${tk.beats.map((_,k)=>`<i class="${k<=tk.i?'on':''}"></i>`).join('')}</div>
      <div class="board-wrap" id="boardTap">
        ${board ? LC.boardHTML(board, CUI()) : ''}
      </div>
      <div class="talk-cap${chk?' tight':''}">
        <p class="talk-say">${esc(talkPrimary)}</p>
        ${talkSecondary?`<p class="talk-en">${esc(talkSecondary)}</p>`:''}
        ${gloss?`<p class="talk-en" style="opacity:.85">${gloss}</p>`:''}
        ${['en','zh'].indexOf(TE().lang)<0?`<p class="talk-en" style="opacity:.62">※ ${
          CUI()?`正式版${TE().name.zh}会用${TE().langName.zh}讲解，原型字幕只写了中文和英文。`
              :`In the real build ${TE().name.en} explains in ${TE().langName.en}; this prototype only has Chinese and English captions.`}</p>`:''}
      </div>
      ${chk ? '' : `<div class="talk-ctl">
        <button id="tkPause" class="${tk.paused?'lit':''}">${tk.paused?ic('play'):ic('pause')}<span>${tk.paused?(CUI()?'继续':'Play'):(CUI()?'暂停':'Pause')}</span></button>
        <button id="tkBack">${ic('repeat')}<span>${CUI()?'重说这句':'Again'}</span></button>
        <button id="tkSlow" class="${tk.slow?'lit':''}">${ic('snail')}<span>${CUI()?'说慢点':'Slower'}</span></button>
        <button id="tkHuh" ${tk.used?'disabled style="opacity:.4"':''}>${ic('help')}<span>${CUI()?'没听懂':'Lost me'}</span></button>
      </div>`}
      ${chk}
      ${endNoCheck}
      <div class="thumb"></div>
    </div>
  </div>`;
  toThumb();

  /* 板书上的「读一遍」 */
  if (sp){
    const bd = document.querySelector('.board-wrap .bd');
    if (bd){
      const btn = document.createElement('button');
      btn.className='bd-say'; btn.setAttribute('aria-label', CUI()?'读一遍':'Play');
      btn.innerHTML = ic('play');
      btn.onclick = e => { e.stopPropagation(); if(!say(sp)) toast('这台设备没有中文语音。','No Chinese voice here.'); };
      bd.appendChild(btn);
    }
  }

  $('lQuit').onclick = quitLesson;
  if ($('boardTap')) $('boardTap').onclick = ()=>{ if(!tk.done) talkNext(); };
  if ($('tkPause')) $('tkPause').onclick = ()=>{
    tk.paused=!tk.paused; if(tk.paused){ clearTimeout(talkTimer); talkTimer=null; } else tk.armed=-1; render();
  };
  if ($('tkBack')) $('tkBack').onclick = ()=>{ tk.armed=-1; render(); };
  if ($('tkSlow')) $('tkSlow').onclick = ()=>{
    tk.slow=!tk.slow; tk.armed=-1; render();
    toast(tk.slow?'好，我说慢一点。':'恢复正常语速。', tk.slow?'All right, slower.':'Back to normal speed.');
  };
  if ($('tkHuh')) $('tkHuh').onclick = ()=>{
    if (tk.used) return;
    tk.beats.splice(tk.i+1, 0, ...(LC.TALKS[tk.id].again||[]));
    tk.used=true; tk.armed=-1; talkNext();
    toast('我换个说法再讲一次。','Let me put it another way.');
  };
  document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{
    if (tk.picked!==null) return;
    if (T.check.opts[+b.dataset.chk].ok) cheer(b);
    tk.picked=+b.dataset.chk; render();
  });
  if ($('tkGo')) $('tkGo').onclick = ()=>{
    if (tk.nested){ L.tk=null; render(); } else segNext();
  };

  /* 自动播放：只在节拍变化时重新计时 */
  if (!tk.done && !tk.paused && tk.armed !== tk.i){
    tk.armed = tk.i;
    clearTimeout(talkTimer);
    talkTimer = setTimeout(talkNext, LC.beatDur(beat, CUI(), tk.slow));
  }
}

/* ---------- 横屏 · 拇指区 ----------
   竖版里「下一题 / 继续 / 上一个」是铺满屏宽的长按钮，跟着内容一起滚。
   横过来以后屏幕只有 400px 上下高，内容一长按钮就掉到折线以下；
   所以渲染完把这些流程按钮从滚动区里拎出来，放进右下角固定的 .thumb，
   每一屏都在同一个位置——横握时右手拇指正好落在那儿。
   只挪 DOM 节点：id 不变，事件绑定都在挪完之后才做，所以逻辑一行没动。 */
function toThumb(){
  const box = document.querySelector('#screens .thumb'); if (!box) return;
  const lb = document.querySelector('#screens .lbody');
  if (lb){
    /* 1) 练习段：lbody 的直接子级按钮（下一个 / 继续 / 上一个 / 听一遍 / 进入剧场 / 先回首页） */
    [...lb.children].forEach(el => { if (el.matches('.btn, .tbtn')) box.appendChild(el); });
    /* 2) 跟读与自由表达：「按住说话」放到右手拇指底下 */
    const cap = lb.querySelector('.mic-cap'), mic = lb.querySelector('.mic');
    if (cap) box.appendChild(cap);
    if (mic) box.appendChild(mic);
  }
  /* 3) 讲解结束时的「继续」：段末一问答完以后的那颗，或者没有段末一问时单独那颗 */
  const go = document.querySelector('#screens #tkGo');
  if (go && !go.closest('.thumb')){
    const host = go.parentElement;
    box.appendChild(go);
    if (host.classList.contains('talk-ctl') && !host.children.length) host.remove();
    /* 讲完了但控制条还在（没有段末一问）：把它也收进同一簇，「重说这句 / 没听懂」排在「继续」左边，
       窄屏上不会两块各占一格、叠在一起 */
    const ctl = document.querySelector('#screens .talk > .talk-ctl');
    if (ctl) box.insertBefore(ctl, box.firstChild);
  }
  box.hidden = !box.children.length;
}

function scenarioLineData(beat, sc){

function scenarioAdvance(){

function bindScenarioMic(){
  const el = $('scenarioMic'); if (!el || !V.scenario) return;
  const cap = $('scenarioMicCap');
  let t0 = 0, timer = null;
  const stop = e => {
    if (!t0) return;
    if (e) e.preventDefault();
    clearTimeout(timer);
    const dur = Date.now() - t0; t0 = 0;
    el.classList.remove('rec');
    if (dur < 350){ if (cap) cap.textContent = pick('按住说话','Hold to speak','Tahan untuk bicara'); return; }
    V.scenario.spoken = true;
    V.scenario.micMsg = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      ? pick('说完了。原型不自动评分，请和上面的示范对照。','Done. This prototype does not score automatically — compare with the model above.','Selesai. Prototipe ini tidak menilai otomatis — bandingkan dengan contoh di atas.')
      : pick('这个环境不支持录音。跟着示范口头说一遍就好。','Recording is unavailable here. Say it once along with the model.','Perekaman tidak tersedia di sini. Ucapkan sekali bersama contohnya.');
    render();
  };
  const start = e => {
    e.preventDefault(); if (t0) return;
    t0 = Date.now(); el.classList.add('rec');
    if (cap) cap.textContent = pick('在听…','Listening…','Mendengarkan…');
    timer = setTimeout(()=>stop(), 6000);
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}

function bindMic(){
  if (ID()) return bindMicId();
  const L=V.lesson, el=$('mic'), cap=$('micCap');
  let t0=0, timer=null;
  const start=e=>{
    e.preventDefault(); t0=Date.now(); el.classList.add('rec');
    cap.textContent = CUI()?'在听…':'Listening…';
    timer=setTimeout(()=>stop(), 6000);
  };
  const stop=()=>{
    if (!t0) return; clearTimeout(timer);
    const dur=Date.now()-t0; t0=0; el.classList.remove('rec');
    if (dur<400){ cap.textContent = CUI()?'按住说话':'Hold to speak'; return; }
    if (segNow().kind==='speak' && L.sub===0){
      const k=(L.ans.rep||0), ok = k>0 || Math.random()>0.35;
      L.ans.rep = k+1;
      const T0 = TTone();
      L.ans.repFb = ok ? { ok:true,  t: ID()?TI().ok:(CUI()?T0.ok.zh:T0.ok.en) }
                       : { ok:false, t: ID()?TI().no:(CUI()?T0.no.zh:T0.no.en) };
    } else {
      L.ans.freeFb = CUI()
        ? '听清了。时间词放在动词前面，这一点你做对了。下面是我会怎么说：'
        : 'Got it. You put the time word before the verb — that part is right. Here’s how I’d say it:';
    }
    render();
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}

/* ID 版麦克风：真的录，能回放，并且明确说明不自动评分。
   —— 原型里的随机对错会让学习者以为自己被评测了，这里改掉。 */
function bindMicId(){
  const L=V.lesson, el=$('mic'), cap=$('micCap');
  let t0=0, timer=null, rec=null, chunks=[], stream=null;
  const release = () => { if (stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch(_){ } stream=null; } };
  const finish = () => {
    if (segNow().kind==='speak' && L.sub===0){
      L.ans.rep = (L.ans.rep||0)+1;
      L.ans.repFb = { demo:true, t:
        (L.ans.rec ? 'Rekaman siap. Dengarkan rekamanmu, lalu bandingkan dengan suara guru — perhatikan nada tiap suku kata.'
                   : 'Mikrofon tidak tersedia di lingkungan ini, jadi rekaman tidak dibuat. Baca ulang sambil mendengarkan suara guru — perhatikan nada tiap suku kata.')
        + ' Prototipe ini belum menilai pengucapan otomatis.' };
    } else {
      L.ans.freeFb = (L.ans.rec ? 'Rekaman tersimpan.' : 'Mikrofon tidak tersedia di sini — coba ucapkan langsung.')
        + ' Bandingkan sendiri dengan contoh guru di bawah; prototipe ini belum menilai otomatis.';
    }
    render();
  };
  const start = async e => {
    e.preventDefault(); if (t0) return;
    t0=Date.now(); el.classList.add('rec'); cap.textContent='Merekam…';
    chunks=[]; rec=null; L.ans.rec=null;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      if (window.MediaRecorder && stream){
        rec = new MediaRecorder(stream);
        rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
        rec.start();
      }
    }catch(_){ rec=null; }
    timer = setTimeout(stop, 8000);
  };
  const stop = () => {
    if (!t0) return; clearTimeout(timer);
    const dur = Date.now()-t0; t0=0; el.classList.remove('rec');
    if (dur<400){ cap.textContent='Tahan untuk bicara'; release(); return; }
    if (rec && rec.state!=='inactive'){
      rec.onstop = () => {
        try{
          const b = new Blob(chunks, { type:(chunks[0]&&chunks[0].type)||'audio/webm' });
          if (b.size) L.ans.rec = URL.createObjectURL(b);
        }catch(_){ }
        release(); finish();
      };
      try{ rec.stop(); }catch(_){ release(); finish(); }
    } else { release(); finish(); }
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointerleave', stop);
  el.addEventListener('pointercancel', stop);
}

/* 手机框视图：把 900×420 整台缩放到面板里。
   横放的机身比竖放宽一倍多，窄面板（右侧预览）里要缩到四成上下，所以下限从 0.5 放到 0.3。 */
function fitFrame(bleed){
  const dev = document.querySelector('.device');
  if (!dev) return;
  dev.style.zoom = '';
  if (bleed){ return; }
  const bar = document.querySelector('.bar');
  const barH = bar ? bar.getBoundingClientRect().height : 0;
  const availH = window.innerHeight - 44 - barH - 18 - 10;   /* 44=body 上下的 22；18=栏的下边距；10=余量 */
  const availW = window.innerWidth - 44 - 10;
  const w = dev.offsetWidth, h = dev.offsetHeight;
  const s = Math.min(1, availW/w, availH/h);
  const use = Math.max(0.3, s);
  if (use < 0.999){
    if ('zoom' in dev.style) dev.style.zoom = use.toFixed(3);
    else { dev.style.transformOrigin='top center'; dev.style.transform='scale('+use.toFixed(3)+')'; dev.style.marginBottom=(-(h*(1-use)))+'px'; }
  }
}

  syncView();
}

  SEGS().forEach((sg,i)=>{

         if(!document.querySelector('.screen')) throw new Error('没有渲染');

         V.lesson={seg:0,sub:0,ans:{},t0:Date.now(),tk:null}; openTalk(id); V.lesson.tk.paused=true;

  });
  try{ S.teacher='lin'; S.taught=true; S.scenarioDone=false; S.scenarioStarted=false; S.scenarioBeat=0; S.lesson=15;
       PREF.pending=true; PREF.returned=false; PREF.done=false;
       V.lesson={seg:SEGS().length-1,sub:0,ans:Object.assign({},ANS),t0:Date.now()-6e5,tk:null}; V.theater=null; V.scenario=null; render();
       if(!$('goScenario')) throw new Error('结课页没有情景对话入口');
       ok('结课 · 情景对话入口'); }
  catch(e){ ok('结课 · 情景对话入口',e); }
  try{ V.lesson=null; V.theater=null; openAfterClassScenario(false);
       if(!document.querySelector('[data-scenario-screen="intro"]') || !$('scenarioStart')) throw new Error('没有渲染情景介绍');
       $('scenarioStart').click();
       if(!document.querySelector('[data-scenario-screen="beat"]') || V.scenario.beat!==0) throw new Error('开始后没有落到第 1 句');
       ok('情景对话 · 场景介绍与第 1 句'); }
  catch(e){ ok('情景对话 · 场景介绍与第 1 句',e); }
  try{ V.scenario.beat=2; S.scenarioBeat=2; S.scenarioStarted=true; closeScenario();
       const gate=document.querySelector('[data-open-theater]');
       if(!gate) throw new Error('Today 没有继续情景入口');
       gate.click();
       if(!V.scenario || !V.scenario.started || V.scenario.beat!==2) throw new Error('没有从第 3 句续上');
       ok('情景对话 · 中途退出后续上'); }
  catch(e){ ok('情景对话 · 中途退出后续上',e); }
  try{ let wrongChecks=0, rightChecks=0;
       SCENARIO_BEATS.forEach((b,i)=>{
         V.scenario.beat=i; V.scenario.picked=null; V.scenario.spoken=false; V.scenario.micMsg=''; render();
         if(!document.querySelector('.scenario-phone')) throw new Error('第 '+(i+1)+' 拍没有渲染');
         if(b.type==='choice'){
           V.scenario.picked=1; render();
           if(!document.querySelector('.scenario-feedback.retry')) throw new Error('第 '+(i+1)+' 拍没有错误反馈');
           wrongChecks++;
           V.scenario.picked=b.options.findIndex(o=>o.ok); render();
           if(!document.querySelector('.scenario-feedback.ok')) throw new Error('第 '+(i+1)+' 拍没有正确反馈');
           if(!document.querySelector('[data-scenario-action="next"]')) throw new Error('第 '+(i+1)+' 拍没有继续按钮');
           rightChecks++;
         } else if(b.type==='repeat'){
           if(!$('scenarioMic')) throw new Error('跟读拍没有麦克风');
           V.scenario.spoken=true; render();
           if(!document.querySelector('[data-scenario-action="finish"]')) throw new Error('跟读后没有完成按钮');
         } else if(!document.querySelector('[data-scenario-action="next"]')){
           throw new Error('第 '+(i+1)+' 拍没有下一句');
         }
       });
       if(wrongChecks!==3 || rightChecks!==3) throw new Error('选择题数量不对：'+wrongChecks+' / '+rightChecks);
       markScenarioComplete();
       if(!document.querySelector('.scenario-recap') || !$('scenarioTheater') || !$('scenarioAgain')) throw new Error('没有情景完成页');
       ok('情景对话 · 9 句 / 3 题 / 跟读 / 完成页'); }
  catch(e){ ok('情景对话 · 9 句 / 3 题 / 跟读 / 完成页',e); }
  try{ if(!S.scenarioDone) throw new Error('完成状态没有写入');
       $('scenarioTheater').click();
       if(!document.querySelector('.theater-phone')) throw new Error('情景完成后没有进入剧场');
       ok('情景对话 → 课后剧场'); }
  catch(e){ ok('情景对话 → 课后剧场',e); }
  try{ S.teacher='lin'; S.taught=true; S.scenarioDone=true; S.scenarioStarted=true; S.lesson=15; PREF.pending=true; PREF.returned=false; PREF.done=false;
       V.scenario=null; openInAppTheater(); if(!document.querySelector('.theater-phone')) throw new Error('没有渲染竖版剧场');
       ok('课后剧场 · 竖版入场'); }
  catch(e){ ok('课后剧场 · 竖版入场',e); }
  try{ V.theater.act=THEATER_ACTS.length-1; V.theater.beat=THEATER_ACTS[V.theater.act].beats.length-1; render();
       if(!document.querySelector('[data-theater-action="finish"]')) throw new Error('夜市收束没有谢幕动作');
       V.theater.done=true; markTheaterRoundComplete(); render(); if(!document.querySelector('.theater-phone.recap')) throw new Error('没有谢幕');
       ok('课后剧场 · 六幕与谢幕'); }
  catch(e){ ok('课后剧场 · 六幕与谢幕',e); }
  try{ V.theater=null; V.tab='today'; render();
       if(!document.querySelector('.street-updates')) throw new Error('完成剧场后没有街区更新');
       if(document.querySelectorAll('.street-person').length!==4) throw new Error('已认识的人数量不对');
       if(document.querySelectorAll('.street-feed-item').length!==3) throw new Error('街区动态数量不对');
       document.querySelector('[data-street-experience]').click();
       if(!document.querySelector('.street-experience-list')) throw new Error('查看经历没有打开');
       closeSheet();
       document.querySelector('[data-street-story]').click();
       if(!document.querySelector('.street-story-detail')) throw new Error('只看故事没有打开');
       closeSheet();
       ok('街区更新 · 完成剧场后出现'); }
  catch(e){ ok('街区更新 · 完成剧场后出现',e); }
  clearTimeout(talkTimer);
  LC.smokeReport('横屏版冒烟', log);
}
</script>
</body>
</html>
